name: Repair Supabase migration history (one-off)

# Manual-only. Final step of reconciling the duplicate-prefix migration mess:
# - 059 (renamed from 036_schedule_function_taxonomy.sql) is already live —
#   mark it applied without re-running its SQL.
# - 054-058 are genuinely missing, confirmed safe to apply for real.
# The two abandoned/incompatible automation designs (037_automation_runtime.sql,
# 037_automation_webhook_test_sessions.sql) were deleted in this same PR —
# the automation job-queue feature isn't in real use yet.
# Delete this workflow file once it has run successfully.
on:
  workflow_dispatch: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Mark 059 (schedule_function_taxonomy) as already applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration repair --status applied 059

      - name: Apply the 5 genuinely missing migrations (054-058)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --include-all --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Migration status after repair + push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --linked

      - name: Validate PostgREST schema cache picked up the new columns
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          status="$({ curl --silent --show-error --output /tmp/schema-check.json --write-out '%{http_code}' \
            --get "${NEXT_PUBLIC_SUPABASE_URL%/}/rest/v1/songs" \
            --data-urlencode 'select=team_mastery' \
            --data-urlencode 'limit=0' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"; } || true)"
          echo "HTTP $status"
          cat /tmp/schema-check.json
