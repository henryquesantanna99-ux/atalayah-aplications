name: Repair Supabase migration history (one-off)

# Manual-only. Applies the 8 migrations (032/036/037 duplicate-prefix files)
# that were never actually run against production, confirmed safe via
# read-only inspection (their tables don't exist yet, and their ALTER
# statements use IF NOT EXISTS). Delete this workflow file once this has
# run successfully — --include-all should never be part of the normal
# deploy pipeline.
on:
  workflow_dispatch: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Apply the 8 missing migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --include-all --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Migration status after apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --linked

      - name: Validate PostgREST schema cache picked up the new columns
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          status="$({ curl --silent --show-error --output /tmp/schema-check.json --write-out '%{http_code}' \
            --get "${NEXT_PUBLIC_SUPABASE_URL%/}/rest/v1/songs" \
            --data-urlencode 'select=team_mastery' \
            --data-urlencode 'limit=0' \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"; } || true)"
          echo "HTTP $status"
          cat /tmp/schema-check.json
