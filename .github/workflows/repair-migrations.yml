name: Repair Supabase migration history (one-off)

# Manual-only. Currently used as a read-only diagnostic step: inspecting
# which of the conflicting 037_automation_* table definitions actually
# exists in production before deciding how to reconcile migration history.
# Delete this workflow file once the migration history repair is finished.
on:
  workflow_dispatch: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Inspect conflicting/relevant tables
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -c "
            select table_name, column_name, data_type
            from information_schema.columns
            where table_schema = 'public'
              and table_name in (
                'automation_workflows', 'automation_executions', 'automation_jobs',
                'automation_runs', 'schedule_functions', 'repertoire_readiness',
                'repertoire_item_analyses', 'repertoire_readiness_analyses',
                'repertoire_analyses'
              )
            order by table_name, ordinal_position;
          "
          echo '---'
          psql "$SUPABASE_DB_URL" -c "
            select table_name
            from information_schema.tables
            where table_schema = 'public'
              and table_name like 'automation_%'
            order by table_name;
          "
