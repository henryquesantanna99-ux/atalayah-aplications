name: Repair Supabase migration history (one-off)

# Manual-only, read-only diagnostic: checking whether 051's and 052's
# effects actually exist (051 confirmed incomplete: is_catalog_visible
# is missing even though tracking says it's applied).
on:
  workflow_dispatch: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Check 051 and 052 effects
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo '--- 051: song_variations_catalog_identity_unique index ---'
          psql "$SUPABASE_DB_URL" -c "select to_regclass('public.song_variations_catalog_identity_unique') as exists;"
          echo '--- 052: events.youtube_playlist_* columns ---'
          psql "$SUPABASE_DB_URL" -c "
            select column_name from information_schema.columns
            where table_schema='public' and table_name='events'
              and column_name like 'youtube_playlist%';
          "
          echo '--- organizations / organization_members tables ---'
          psql "$SUPABASE_DB_URL" -c "
            select table_name from information_schema.tables
            where table_schema='public' and table_name in ('organizations','organization_members');
          "
          echo '--- ycloud tables ---'
          psql "$SUPABASE_DB_URL" -c "
            select table_name from information_schema.tables
            where table_schema='public' and table_name in ('ycloud_sync_checkpoints','ycloud_webhook_events');
          "
