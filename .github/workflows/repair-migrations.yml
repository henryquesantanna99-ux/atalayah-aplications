name: Repair Supabase migration history (one-off)

# Manual-only. Currently used as a read-only diagnostic step: inspecting
# which of the conflicting 037_automation_* table definitions actually
# exists in production before deciding how to reconcile migration history.
# Delete this workflow file once the migration history repair is finished.
on:
  workflow_dispatch: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Inspect remaining columns before deciding on --include-all
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -c "
            select 'songs.team_mastery' as check, exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='songs' and column_name='team_mastery'
            ) as exists;
          "
          psql "$SUPABASE_DB_URL" -c "
            select 'worship_song_suggestions.region' as check, exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='worship_song_suggestions' and column_name='region'
            ) as exists;
          "
          psql "$SUPABASE_DB_URL" -c "
            select 'song_musical_analyses.ici_score' as check, exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='song_musical_analyses' and column_name='ici_score'
            ) as exists;
          "
