name: Repair Supabase migration history (one-off)

# Manual-only, read-only diagnostic: checking exactly what
# validate_production_schema.sql found missing (migration 050's effects),
# and scanning for other 001-053 migrations that may be marked applied
# but never actually ran.
on:
  workflow_dispatch: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check migration 050/051/052 effects
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -c "
            select column_name from information_schema.columns
            where table_schema='public' and table_name='songs'
              and column_name in ('normalized_title','normalized_artist','is_catalog_visible');
          "
          psql "$SUPABASE_DB_URL" -c "
            select to_regclass('public.songs_normalized_identity_unique') as index_exists;
          "
          psql "$SUPABASE_DB_URL" -c "
            select to_regprocedure('public.save_event_scale(uuid,jsonb,jsonb,jsonb)') as function_exists;
          "

      - name: List all public tables actually in production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -t -c "
            select table_name from information_schema.tables
            where table_schema = 'public' order by table_name;
          " > /tmp/live_tables.txt
          cat /tmp/live_tables.txt
