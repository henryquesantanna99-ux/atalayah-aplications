name: Repair Supabase migration history (one-off)

# Manual-only. Applies the real content of what used to be
# 051_general_setlist_visibility.sql (renamed to 061 — its old version
# number was already falsely marked "applied" by the initial bulk
# history repair, so it needed a fresh, higher version to actually run).
# Confirmed missing: songs.is_catalog_visible. Since 061 > the current
# max applied version (060), a plain `db push` (no --include-all) is
# expected to pick it up normally — this doubles as a sanity check that
# future ordinary migrations will apply cleanly through the real deploy
# pipeline. Delete this workflow file once this has run successfully.
on:
  workflow_dispatch: {}

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Remove the stale '051' entry left by the original bulk repair
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration repair --status reverted 051

      - name: Apply migration 061 (was 051_general_setlist_visibility)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Migration status after apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --linked

      - name: Verify songs.is_catalog_visible now exists
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -c "
            select column_name from information_schema.columns
            where table_schema='public' and table_name='songs'
              and column_name in ('normalized_title','normalized_artist','is_catalog_visible');
          "
